name: Database Backup

# Supabase's free tier (what this project runs on) has no automated backups at
# all. This dumps the full Postgres database daily and uploads it to R2 as a
# real recovery point. Keep this even after upgrading Supabase's plan — never
# rely on a single backup source.

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC daily (~23:30 IST)
  workflow_dispatch: {} # allows a manual "Run workflow" for on-demand backups

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL client tools (for pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      - name: Run database backup
        run: npm run backup:database --workspace backend
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
