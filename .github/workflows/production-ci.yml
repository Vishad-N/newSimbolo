name: Production CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: simbolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simbolo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Run backend tests
        run: npm test --workspace backend -- --runInBand
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

      - name: Build backend
        run: npm run build --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Build frontend apps
        run: npm run build --workspaces --if-present
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build backend Docker image
        run: docker build -t simbolo-backend:ci backend

  deploy-placeholder:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy using the environment-specific runbook in docs/deployment/production-deployment.md"
