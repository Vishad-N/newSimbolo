name: Production CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: {} # allows a manual "Run workflow" to test the pipeline on-demand

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: simbolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simbolo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate production environment contract
        run: npm run env:validate --workspace backend
        env:
          NODE_ENV: production
          PORT: 3001
          FRONTEND_URLS: http://localhost:3000
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret-with-enough-length
          JWT_REFRESH_SECRET: ci-refresh-secret-with-enough-length
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret-with-enough-length
          GOOGLE_CALLBACK_URL: http://localhost:3001/api/v1/auth/google/callback
          GEMINI_API_KEY: ci-gemini-api-key-with-enough-length
          RAZORPAY_KEY_ID: rzp_test_ci_key
          RAZORPAY_KEY_SECRET: ci-razorpay-secret-with-enough-length
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ci-smtp-user
          SMTP_PASSWORD: ci-smtp-password-with-enough-length
          CLOUDINARY_CLOUD_NAME: ci-cloud
          CLOUDINARY_API_KEY: ci-cloudinary-key
          CLOUDINARY_API_SECRET: ci-cloudinary-secret-with-enough-length

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Run backend tests
        run: npm test --workspace backend -- --runInBand
        env:
          NODE_ENV: test
          FRONTEND_URLS: http://localhost:3000
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

      - name: Build backend
        run: npm run build --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Build frontend apps
        run: npm run build --workspaces --if-present
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t simbolo-backend:ci .

  # NOTE: Railway and Vercel currently also auto-deploy directly on push via their
  # own GitHub integrations, independent of this workflow. These jobs are an
  # ADDITIONAL, CI-gated deploy path (they only run after `verify` passes) — they
  # do not replace or block the platforms' own auto-deploy. Until that auto-deploy
  # is disabled on each platform, a failing test here does not prevent a bad
  # deploy from going out via the platform's own git integration.
  deploy-backend-railway:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy backend to Railway
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        # RAILWAY_TOKEN must be a PROJECT token (Railway dashboard → this project →
        # Settings → Tokens), not a personal account token — a project token lets
        # the CLI resolve the project/environment non-interactively in CI.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm i -g @railway/cli
          railway up --service "${{ vars.RAILWAY_BACKEND_SERVICE || '@simbolo/backend' }}" --detach --yes
        working-directory: backend

  deploy-frontend-vercel:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, client, landing]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ${{ matrix.app }} to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets[format('VERCEL_ORG_ID_{0}', matrix.app)] }}
          VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.app)] }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        working-directory: apps/${{ matrix.app }}
