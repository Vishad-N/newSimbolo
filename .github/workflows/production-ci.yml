name: Production CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: {} # allows a manual "Run workflow" to test the pipeline on-demand

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: simbolo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d simbolo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate production environment contract
        run: npm run env:validate --workspace backend
        env:
          NODE_ENV: production
          PORT: 3001
          FRONTEND_URLS: http://localhost:3000
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret-with-enough-length
          JWT_REFRESH_SECRET: ci-refresh-secret-with-enough-length
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret-with-enough-length
          GOOGLE_CALLBACK_URL: http://localhost:3001/api/v1/auth/google/callback
          GEMINI_API_KEY: ci-gemini-api-key-with-enough-length
          RAZORPAY_KEY_ID: rzp_test_ci_key
          RAZORPAY_KEY_SECRET: ci-razorpay-secret-with-enough-length
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_USER: ci-smtp-user
          SMTP_PASSWORD: ci-smtp-password-with-enough-length
          CLOUDINARY_CLOUD_NAME: ci-cloud
          CLOUDINARY_API_KEY: ci-cloudinary-key
          CLOUDINARY_API_SECRET: ci-cloudinary-secret-with-enough-length

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Run backend tests
        run: npm test --workspace backend -- --runInBand
        env:
          NODE_ENV: test
          FRONTEND_URLS: http://localhost:3000
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

      - name: Build backend
        run: npm run build --workspace backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/simbolo_test?schema=public

      - name: Build frontend apps
        run: npm run build --workspaces --if-present
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t simbolo-backend:ci .

  # NOTE: Railway and Vercel currently also auto-deploy directly on push via their
  # own GitHub integrations, independent of this workflow. These jobs are an
  # ADDITIONAL, CI-gated deploy path (they only run after `verify` passes) — they
  # do not replace or block the platforms' own auto-deploy. Until that auto-deploy
  # is disabled on each platform, a failing test here does not prevent a bad
  # deploy from going out via the platform's own git integration.
  deploy-backend-railway:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy backend to Railway
        id: railway-deploy
        # RAILWAY_TOKEN must be a PROJECT token (Railway dashboard → this project →
        # Settings → Tokens), not a personal account token — a project token lets
        # the CLI resolve the project/environment non-interactively in CI.
        # (The `secrets` context can't be used in a step's `if:` — GitHub Actions
        # rejects that at workflow-validation time — so the skip check happens
        # inside the shell instead.)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN not set — skipping Railway deploy."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_ID="${{ vars.RAILWAY_PROJECT_ID || 'c3a54790-eeb7-4274-b04b-c93f6143e8a1' }}"
          ENVIRONMENT_ID="${{ vars.RAILWAY_ENVIRONMENT_ID || 'a264b8bd-eb0d-4c96-8f62-39c53a8a304d' }}"
          SERVICE_ID="${{ vars.RAILWAY_SERVICE_ID || '2096a21f-ca7b-4ce4-94f5-e8f14e93ee04' }}"
          SERVICE_NAME="${{ vars.RAILWAY_BACKEND_SERVICE || '@simbolo/backend' }}"

          # Capture the currently-running deployment BEFORE deploying a new one, so
          # there is a known-good target to roll back to if the post-deploy smoke
          # test (next step) finds the new deployment unhealthy. Best-effort: if
          # this lookup fails for any reason, the deploy still proceeds — it just
          # means an automatic rollback won't be possible and manual intervention
          # would be needed instead.
          QUERY_RESULT=$(railway api \
            'query($input: DeploymentListInput!) { deployments(input: $input, first: 1) { edges { node { id status } } } }' \
            --var "input={\"projectId\":\"$PROJECT_ID\",\"serviceId\":\"$SERVICE_ID\",\"environmentId\":\"$ENVIRONMENT_ID\",\"status\":{\"successfulOnly\":true}}" \
            --compact --allow-errors 2>/dev/null || echo '{}')
          PREVIOUS_DEPLOYMENT_ID=$(echo "$QUERY_RESULT" | jq -r '.data.deployments.edges[0].node.id // empty')
          echo "Previous known-good deployment: ${PREVIOUS_DEPLOYMENT_ID:-none captured}"
          echo "previous_deployment_id=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

          # No --detach: that only confirms the upload started, not that the
          # build/deploy actually succeeded — a Dockerfile error like the
          # "COPY backend ./backend: not found" one we just hit would still
          # report this CI step as green. Block and stream logs instead so a
          # real build failure fails this job too.
          railway up --service "$SERVICE_NAME" --yes
        # Must run from the repo ROOT, not backend/ — backend/Dockerfile expects
        # the whole monorepo as its build context (it does `COPY backend ./backend`,
        # `COPY package.json ...`), matching how the "Build backend Docker image"
        # step in the verify job already builds it (`docker build -f backend/Dockerfile .`
        # from root). Running `railway up` from inside backend/ uploads only that
        # subfolder, so the Dockerfile's COPY backend ./backend step finds nothing.

      - name: Post-deploy smoke test
        if: steps.railway-deploy.outputs.skipped != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          HEALTH_URL="${{ vars.RAILWAY_BACKEND_HEALTH_URL || 'https://simbolobackend-production.up.railway.app/api/v1/health' }}"
          echo "Smoke-testing $HEALTH_URL ..."

          ATTEMPTS=10
          for i in $(seq 1 $ATTEMPTS); do
            RESPONSE=$(curl -sf --max-time 10 "$HEALTH_URL" 2>/dev/null || true)
            STATUS=$(echo "$RESPONSE" | jq -r '.data.status // empty' 2>/dev/null || true)
            if [ "$STATUS" = "ok" ]; then
              echo "Smoke test passed on attempt $i/$ATTEMPTS (status=ok)."
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: not healthy yet (status='${STATUS:-none}'). Retrying in 6s..."
            sleep 6
          done

          echo "::error::Post-deploy smoke test FAILED after $ATTEMPTS attempts — the new backend deployment is not healthy."

          PREVIOUS_DEPLOYMENT_ID="${{ steps.railway-deploy.outputs.previous_deployment_id }}"
          if [ -z "$PREVIOUS_DEPLOYMENT_ID" ]; then
            echo "::error::No previous known-good deployment was captured — cannot auto-rollback. Roll back manually from the Railway dashboard."
            exit 1
          fi

          echo "Rolling back to previous deployment $PREVIOUS_DEPLOYMENT_ID ..."
          railway api 'mutation($id: String!) { deploymentRollback(id: $id) { id status } }' --var "id=$PREVIOUS_DEPLOYMENT_ID" --compact
          echo "::error::Rolled back backend to deployment $PREVIOUS_DEPLOYMENT_ID. Investigate the failed deployment before retrying."
          exit 1

  deploy-frontend-vercel:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, client, landing]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ${{ matrix.app }} to Vercel
        id: vercel-deploy
        # (The `secrets` context can't be used in a step's `if:` — GitHub Actions
        # rejects that at workflow-validation time — so the skip check happens
        # inside the shell instead.)
        #
        # Deliberately runs from the repo ROOT, not apps/<app> — each Vercel
        # project already has its own `rootDirectory` (apps/admin, apps/client,
        # apps/landing) configured on Vercel's side, same as its native git
        # auto-deploy uses. cd-ing into the app folder here too made Vercel try
        # to apply that rootDirectory a second time on top of an already-scoped
        # path (apps/client/apps/client did not exist) — `vercel build` ignored
        # the conflict with a warning, but `vercel deploy` hard-failed on it.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets[format('VERCEL_ORG_ID_{0}', matrix.app)] }}
          VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.app)] }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deploy for ${{ matrix.app }}."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture the deployment currently live in production BEFORE deploying a
          # new one, so there is a known-good target to roll back to if the
          # post-deploy smoke test (next step) finds the new deployment unhealthy.
          # Uses the documented REST API directly (GET /v7/deployments) rather than
          # `vercel ls --json`, whose output shape isn't a stable/documented bare
          # array and previously broke this exact lookup.
          # Best-effort: if this lookup fails, the deploy still proceeds — an
          # automatic rollback just won't be possible and manual intervention
          # would be needed instead.
          DEPLOYMENTS_JSON=$(curl -sf --max-time 15 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v7/deployments?projectId=$VERCEL_PROJECT_ID&target=production&state=READY&limit=1$( [ -n "$VERCEL_ORG_ID" ] && printf '&teamId=%s' "$VERCEL_ORG_ID" )" \
            2>/dev/null || echo '{}')
          PREVIOUS_DEPLOYMENT_ID=$(echo "$DEPLOYMENTS_JSON" | jq -r '.deployments[0].uid // empty')
          echo "Previous known-good deployment: ${PREVIOUS_DEPLOYMENT_ID:-none captured}"
          echo "previous_deployment_id=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Post-deploy smoke test (${{ matrix.app }})
        if: steps.vercel-deploy.outputs.skipped != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SMOKE_URL="${{ vars[format('VERCEL_SMOKE_URL_{0}', matrix.app)] }}"
          if [ -z "$SMOKE_URL" ]; then
            echo "No smoke-test URL configured for ${{ matrix.app }} (set repo variable VERCEL_SMOKE_URL_${{ matrix.app }}) — skipping smoke test."
            exit 0
          fi

          echo "Smoke-testing $SMOKE_URL ..."
          ATTEMPTS=8
          for i in $(seq 1 $ATTEMPTS); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SMOKE_URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Smoke test passed on attempt $i/$ATTEMPTS (HTTP $CODE)."
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: HTTP $CODE. Retrying in 5s..."
            sleep 5
          done

          echo "::error::Post-deploy smoke test FAILED for ${{ matrix.app }} after $ATTEMPTS attempts."

          PREVIOUS_DEPLOYMENT_ID="${{ steps.vercel-deploy.outputs.previous_deployment_id }}"
          if [ -z "$PREVIOUS_DEPLOYMENT_ID" ]; then
            echo "::error::No previous known-good deployment was captured — cannot auto-rollback. Roll back manually from the Vercel dashboard."
            exit 1
          fi

          echo "Rolling back ${{ matrix.app }} to deployment $PREVIOUS_DEPLOYMENT_ID ..."
          npx vercel rollback "$PREVIOUS_DEPLOYMENT_ID" --token="$VERCEL_TOKEN" --yes
          echo "::error::Rolled back ${{ matrix.app }} to deployment $PREVIOUS_DEPLOYMENT_ID. Investigate the failed deployment before retrying."
          exit 1
