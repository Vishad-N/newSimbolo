version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: simbolo-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: simbolo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simbolo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: simbolo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: simbolo-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PORT: 3001
      API_PREFIX: api
      API_VERSION: v1
      FRONTEND_URLS: http://localhost:3000,http://localhost:3002,http://localhost:3003
      DATABASE_URL: postgresql://postgres:password@postgres:5432/simbolo?schema=public
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-jwt-key-change-in-production-simbolo-2026
      JWT_REFRESH_SECRET: super-secret-refresh-key-change-in-production-simbolo-2026
      GOOGLE_OAUTH_ENABLED: "false"
      GEMINI_ENABLED: "false"
      RAZORPAY_ENABLED: "false"
      EMAIL_ENABLED: "false"
      CLOUDINARY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
